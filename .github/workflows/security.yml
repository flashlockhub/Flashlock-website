name: Security and static build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan current tree for secrets (no history)
        run: bash scripts/scan-secrets.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - name: Verify project-path static export
        run: npm run build:pages
      - name: Verify custom-domain static export
        run: npm run build:domain
      - name: Scan generated publication files
        run: npm run security:secrets
